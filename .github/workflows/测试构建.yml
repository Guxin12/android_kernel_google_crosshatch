name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "选择编译模式"
        type: choice
        options:
          - 只编译内核
          - 只编译内核模块
          - 编译内核和内核模块
        required: true
        default: 只编译内核
      kpm_patch:
        description: "是否添加KPM修补？"
        type: boolean
        required: true
        default: false
      thin_lto:
        description: "是否启用ThinLTO？"
        type: boolean
        required: true
        default: true

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            git curl unzip bc python3 make gcc g++ patch ccache zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            lld llvm clang

      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version || true
          ccache --max-size=2G || true
          ccache --set-config=compression=true || true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 从缓存中还原 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: marble-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            marble-ccache-${{ github.ref_name }}-

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: Guxin12/android_kernel_google_crosshatch
          ref: ACF
          path: kernel
          fetch-depth: 0

      - name: 设置 Clang 工具链
        run: |
          mkdir -p clang
          # 根据编译模式选择 Clang 版本
          if [ "${{ github.event.inputs.build_mode }}" = "只编译内核" ]; then
            echo "使用 Google Clang 12.0.5 (只编译内核模式)"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/428d18d9732aa7ebfcaed87a582d86155db878d4/clang-r416183b.tar.gz"  # 替换为实际的 Google Clang 12.0.5 URL
          else
            echo "使用 Google Clang 12.0.5 (编译模块模式)"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/428d18d9732aa7ebfcaed87a582d86155db878d4/clang-r416183b.tar.gz"
          fi
          
          curl -L -o clang/clang.tar.gz $CLANG_URL
          tar -zxf clang/clang.tar.gz -C clang
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: 配置内核
        working-directory: ./kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${CLANG_PATH}:${PATH}
          export KBUILD_BUILD_HOST="Marble"
          export KBUILD_BUILD_USER="Guxin12"
          export CC="ccache clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

          make LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- O=out mrproper
          make LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- O=out marble_defconfig
          
          # 根据输入配置ThinLTO
          if [ "${{ github.event.inputs.thin_lto }}" = "true" ]; then
            echo "启用 ThinLTO..."
            ./scripts/config --file out/.config -e LTO_CLANG -e THINLTO
          else
            echo "禁用 ThinLTO..."
            ./scripts/config --file out/.config -e LTO_CLANG -d THINLTO
          fi
          
          # 根据输入配置KPM
          if [ "${{ github.event.inputs.kpm_patch }}" = "true" ]; then
            echo "启用 CONFIG_KPM..."
            ./scripts/config --file out/.config -e CONFIG_KPM
          else
            echo "禁用 CONFIG_KPM..."
            ./scripts/config --file out/.config -d CONFIG_KPM
          fi
          
          make LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- O=out olddefconfig

      - name: 编译内核 (如果选择)
        if: ${{ github.event.inputs.build_mode == '只编译内核' || github.event.inputs.build_mode == '编译内核和内核模块' }}
        working-directory: ./kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${CLANG_PATH}:${PATH}
          export KBUILD_BUILD_HOST="Marble"
          export KBUILD_BUILD_USER="Guxin12"
          export CC="ccache clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- O=out -j$(nproc --all) Image

          # 生成时间戳和 short sha，并导出为 env 供后续步骤使用
          TIMESTAMP=$(date +"%Y%m%d-%H%M")
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          TAG_NAME="build-${TIMESTAMP}-${SHORT_SHA}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          RELEASE_NAME="${TIMESTAMP}-${SHORT_SHA}"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

          RELEASE_BODY="自动构建：${RELEASE_NAME}（由 GitHub Actions 创建）"
          echo "RELEASE_BODY=${RELEASE_BODY}" >> $GITHUB_ENV

          echo "IMAGE_NAME=marble-kernel-${TIMESTAMP}" >> $GITHUB_ENV
          echo "IMAGE_PATH=$(pwd)/out/arch/arm64/boot/Image" >> $GITHUB_ENV
          echo "ARTIFACT_PREFIX=original" >> $GITHUB_ENV

          ccache -s || true

      - name: 编译内核模块 (如果选择)
        if: ${{ github.event.inputs.build_mode == '只编译内核模块' || github.event.inputs.build_mode == '编译内核和内核模块' }}
        working-directory: ./kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${CLANG_PATH}:${PATH}
          export KBUILD_BUILD_HOST="Marble"
          export KBUILD_BUILD_USER="Guxin12"
          export CC="ccache clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          # 如果是只编译内核模块模式，需要先编译必要的内核部分
          if [ "${{ github.event.inputs.build_mode }}" = "只编译内核模块" ]; then
            echo "只编译内核模块模式，先编译必要的内核部分..."
            make LLVM=1 LLVM_IAS=1 O=out -j$(nproc --all) modules_prepare
            
            # 生成时间戳和 short sha
            TIMESTAMP=$(date +"%Y%m%d-%H%M")
            echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
            
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
            
            TAG_NAME="build-${TIMESTAMP}-${SHORT_SHA}"
            echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
            
            RELEASE_NAME="${TIMESTAMP}-${SHORT_SHA}"
            echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
            
            RELEASE_BODY="自动构建：${RELEASE_NAME}（由 GitHub Actions 创建）"
            echo "RELEASE_BODY=${RELEASE_BODY}" >> $GITHUB_ENV
          fi
          
          # 编译模块
          make LLVM=1 LLVM_IAS=1 O=out -j$(nproc --all) modules

          ccache -s || true

      - name: KPM修补（SukiSU） - 可选
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.kpm_patch == 'true' && (github.event.inputs.build_mode == '只编译内核' || github.event.inputs.build_mode == '编译内核和内核模块') }}
        working-directory: ./kernel/out/arch/arm64/boot
        run: |
          echo "正在为 KPM 修补内核镜像..."
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch || true
          chmod +x patch || true
          ./patch || true

          if [ -f "oImage" ]; then
            mv -f oImage Image || true
            echo "ARTIFACT_PREFIX=kpm-patched" >> $GITHUB_ENV
            echo "内核镜像 KPM 修补成功"
          else
            if [ -f "Image" ]; then
              echo "未检测到 oImage，但 Image 存在，继续流程"
              echo "ARTIFACT_PREFIX=kpm-patched" >> $GITHUB_ENV
            else
              echo "警告：修补工具未产生 oImage 或 Image，继续但可能无可用镜像" >&2 || true
            fi
          fi

      - name: 收集并打包内核模块 (如果选择)
        if: ${{ github.event.inputs.build_mode == '只编译内核模块' || github.event.inputs.build_mode == '编译内核和内核模块' }}
        working-directory: ./kernel/out
        run: |
          MODULES_DIR="modules_collection"
          mkdir -p ${MODULES_DIR}
          echo "开始搜索内核模块文件(.ko)..."
          find . -type f -name "*.ko" ! -path "*build*" ! -path "*source*" | while read -r ko_file; do
            rel_path=$(dirname "${ko_file#./}")
            target_dir="${MODULES_DIR}/${rel_path}"
            mkdir -p "${target_dir}"
            cp -v "${ko_file}" "${target_dir}/"
            echo "已添加: ${rel_path}/$(basename ${ko_file})"
          done
          MODULES_ZIP_NAME="modules-marble-kernel.zip"
          cd ${MODULES_DIR}
          zip -r9q "../${MODULES_ZIP_NAME}" .
          cd ..
          echo "内核模块打包完成: ${MODULES_ZIP_NAME}"
          echo "MODULES_ZIP=$(pwd)/${MODULES_ZIP_NAME}" >> $GITHUB_ENV
          echo "MODULES_ZIP_NAME=${MODULES_ZIP_NAME}" >> $GITHUB_ENV

      - name: 准备 AnyKernel3 刷机包 (如果选择)
        if: ${{ github.event.inputs.build_mode == '只编译内核' || github.event.inputs.build_mode == '编译内核和内核模块' }}
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cat > AnyKernel3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ACF by Guxin12 酷安@初春在鹿野
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties
          ### AnyKernel install
          ## boot files attributes
          #boot_attributes() {
          #set_perm_recursive 0 0 755 644 $RAMDISK/*;
          #set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          #} # end attributes
          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;
          # boot install
          if [ -L "/dev/block/bootdevice/by-name/init_boot_a" -o -L "/dev/block/by-name/init_boot_a" ]; then
              split_boot # for devices with init_boot ramdisk
              flash_boot # for devices with init_boot ramdisk
          else
              dump_boot # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk
              write_boot # use flash_boot to skip ramdisk repack, e.g. for devices with init_boot ramdisk
          fi
          ## end boot install
          EOF

          # 复制内核镜像到 AnyKernel3（如果存在）
          if [ -f "${IMAGE_PATH:-./kernel/out/arch/arm64/boot/Image}" ]; then
            mkdir -p AnyKernel3
            cp "${IMAGE_PATH:-./kernel/out/arch/arm64/boot/Image}" AnyKernel3/Image
          fi

          echo "ZIP_NAME=marblekernel.zip" >> $GITHUB_ENV
          cd AnyKernel3
          zip -r9 ../${ZIP_NAME:-marblekernel.zip} *
          cd ..
          echo "AnyKernel3 刷机包已生成: ${ZIP_NAME:-marblekernel.zip}"

      - name: 创建构建摘要
        run: |
          BUILD_END=$(date +%s)
          BUILD_START_VAL=${BUILD_START:-0}
          BUILD_SEC=$((BUILD_END - BUILD_START_VAL))
          BUILD_MIN=$((BUILD_SEC/60))
          BUILD_SEC_REM=$((BUILD_SEC%60))
          BUILD_TIME=$(printf "%d分%02d秒" ${BUILD_MIN} ${BUILD_SEC_REM})

          echo "### 🚀🚀🚀 内核构建报告" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **构建模式** | ${{ github.event.inputs.build_mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **构建ID** | ${IMAGE_NAME:-unknown} |" >> $GITHUB_STEP_SUMMARY
          echo "| **内核版本** | 请检查实际刷机包 |" >> $GITHUB_STEP_SUMMARY
          echo "| **配置文件** | marble_defconfig |" >> $GITHUB_STEP_SUMMARY
          echo "| **构建耗时** | ${BUILD_TIME} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.kpm_patch }}" = "true" ]; then
            echo "| **KPM支持** | ✅ 已启用 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **KPM支持** | ❌❌ 未启用 |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.thin_lto }}" = "true" ]; then
            echo "| **ThinLTO** | ✅ 已启用 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **ThinLTO** | ❌❌ 未启用 |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **编译主机** | ${{ runner.os }} (Ubuntu 22.04) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.build_mode }}" = "只编译内核" ]; then
            echo "| **工具链** | Google Clang 12.0.5 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **工具链** | Clang 12.0.5 |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **缓存命中率** | $(ccache -s | grep 'cache hit rate' | awk '{print $4}' || true) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦📦 构建产物（已上传到 Release）" >> $GITHUB_STEP_SUMMARY
          echo "- **Release 名称**: ${RELEASE_NAME:-unknown}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.build_mode }}" != "只编译内核模块" ]; then
            echo "- **内核镜像**: \`${IMAGE_PATH:-unknown}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **刷机包**: \`${ZIP_NAME:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.build_mode }}" != "只编译内核" ]; then
            echo "- **内核模块包**: \`${MODULES_ZIP:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.build_mode }}" != "只编译内核" ]; then
            echo "### 📁📁 内核模块目录结构" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            if [ -d "${GITHUB_WORKSPACE}/kernel/out/modules_collection" ]; then
              cd ${GITHUB_WORKSPACE}/kernel/out/modules_collection
              find . -type f | sed 's|^\./||' | sort >> $GITHUB_STEP_SUMMARY
              cd - >/dev/null
            else
              echo "未找到内核模块目录" >> $GITHUB_STEP_SUMMARY
            fi
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 🔗🔗 Release 链接 (请在 Actions 页面查看 Release)" >> $GITHUB_STEP_SUMMARY
          echo "Release Tag: ${TAG_NAME:-unknown}" >> $GITHUB_STEP_SUMMARY

          echo "### 🔄🔄 ccache统计信息" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY || true
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: 上传构建产物列表
        run: |
          echo "准备上传以下构建产物:"
          if [ "${{ github.event.inputs.build_mode }}" != "只编译内核模块" ]; then
            ls -lh ${{ env.IMAGE_PATH }} ${{ env.ZIP_NAME }} || true
          fi
          if [ "${{ github.event.inputs.build_mode }}" != "只编译内核" ]; then
            ls -lh ${{ env.MODULES_ZIP }} || true
          fi

      - name: 发布到 GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ${{ github.event.inputs.build_mode != '只编译内核模块' && env.IMAGE_PATH || '' }}
            ${{ github.event.inputs.build_mode != '只编译内核模块' && env.ZIP_NAME || '' }}
            ${{ github.event.inputs.build_mode != '只编译内核' && env.MODULES_ZIP || '' }}
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          allowUpdates: true
