name: 编译谷歌4.9内核

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "输入要编译的分支名称"
        required: true
        default: "ACF1"
      tag_name:
        description: "Release 标签 (例如 v1.0)"
        required: true
        default: "v1.0"

jobs:
  build:
    # 确保 GITHUB_TOKEN 有写权限以便创建 tag/release/上传 release asset
    permissions:
      contents: write

    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 检查源码（含子模块）
        uses: actions/checkout@v3
        with:
          repository: Guxin12/android_kernel_google_crosshatch
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: 设置 ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex git curl wget unzip zip make patch ccache \
            python3 python3-distutils libncurses5-dev libncursesw5-dev libncurses-dev \
            libssl-dev libelf-dev lld llvm clang gcc g++ gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi fakeroot kmod rsync u-boot-tools tar xz-utils \
            clang-14 llvm-14 llvm-14-dev

      # -------------------- 设置环境变量 --------------------
      - name: 设置环境变量
        run: |
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=Marble" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Guxin12" >> $GITHUB_ENV

      # -------------------- 配置ccache --------------------
      - name: 配置ccache
        run: |
          ccache -M 10G  # 设置ccache缓存大小为10GB
          ccache -s      # 显示ccache状态

      # -------------------- 编译内核镜像 --------------------
      - name: 编译内核镜像
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_HOST="Marble"
          export KBUILD_BUILD_USER="Guxin12"
          
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV
          
          # 禁用 32 位 VDSO 避免 -EL 错误
          
          make mrproper
          make O=out b1c1_defconfig
          
          # 只编译内核镜像，不编译模块
          make -j$(nproc) O=out \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image  # 只编译内核镜像

          # 生成时间戳和 short sha，并导出为 env 供后续步骤使用
          TIMESTAMP=$(date +"%Y%m%d-%H%M")
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          TAG_NAME="${{ github.event.inputs.tag_name }}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          RELEASE_NAME="${TAG_NAME}-${TIMESTAMP}-${SHORT_SHA}"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

          RELEASE_BODY="自动构建：${RELEASE_NAME}（由 GitHub Actions 创建）"
          echo "RELEASE_BODY=${RELEASE_BODY}" >> $GITHUB_ENV

          echo "IMAGE_PATH=$(pwd)/out/arch/arm64/boot/Image" >> $GITHUB_ENV
          echo "IMAGE_NAME=kernel-${TIMESTAMP}.img" >> $GITHUB_ENV

          ccache -s || true

      # -------------------- 创建构建摘要 --------------------
      - name: 创建构建摘要
        run: |
          BUILD_END=$(date +%s)
          BUILD_START_VAL=${BUILD_START:-0}
          BUILD_SEC=$((BUILD_END - BUILD_START_VAL))
          BUILD_MIN=$((BUILD_SEC/60))
          BUILD_SEC_REM=$((BUILD_SEC%60))
          BUILD_TIME=$(printf "%d分%02d秒" ${BUILD_MIN} ${BUILD_SEC_REM})

          echo "### 🚀🚀🚀 内核构建报告" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **构建ID** | ${IMAGE_NAME:-unknown} |" >> $GITHUB_STEP_SUMMARY
          echo "| **配置文件** | b1c1_defconfig |" >> $GITHUB_STEP_SUMMARY
          echo "| **构建耗时** | ${BUILD_TIME} |" >> $GITHUB_STEP_SUMMARY
          echo "| **编译主机** | ${{ runner.os }} (Ubuntu 22.04) |" >> $GITHUB_STEP_SUMMARY
          echo "| **工具链** | Clang + LLVM工具链 |" >> $GITHUB_STEP_SUMMARY
          echo "| **缓存命中率** | $(ccache -s | grep 'cache hit rate' | awk '{print $4}' || true) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦📦 构建产物（已上传到 Release）" >> $GITHUB_STEP_SUMMARY
          echo "- **Release 名称**: ${RELEASE_NAME:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "- **内核镜像**: \`${IMAGE_PATH:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔄🔄 ccache统计信息" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY || true
          echo "```" >> $GITHUB_ENV

      # -------------------- 上传构建产物列表 --------------------
      - name: 上传构建产物列表
        run: |
          echo "准备上传以下构建产物:"
          ls -lh ${IMAGE_PATH}

      # -------------------- 发布到 GitHub Release --------------------
      - name: 发布到 GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # 上传内核镜像
          artifacts: |
            ${{ env.IMAGE_PATH }}
          # 使用构建过程中生成的标签和名称
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # 设置为正式发布
          draft: false
          prerelease: false
          # 如果标签不存在则自动创建
          allowUpdates: true