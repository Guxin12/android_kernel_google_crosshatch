name: 编译谷歌4.9内核

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "选择要编译的分支"
        required: true
        default: "ACF6"
      tag_name:
        description: "Release 标签 (例如 v1.0)"
        required: true
        default: "v1.0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检查源码（含子模块）
        uses: actions/checkout@v3
        with:
          repository: Guxin12/android_kernel_google_crosshatch
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: 设置 ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex git curl wget unzip zip make patch ccache \
            python3 python3-distutils libncurses5-dev libncursesw5-dev libncurses-dev \
            libssl-dev libelf-dev lld llvm clang gcc g++ gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi fakeroot kmod rsync u-boot-tools tar xz-utils

      # -------------------- Clang 缓存下载 --------------------
      - name: Clang 缓存
        uses: actions/cache@v3
        id: clang-cache
        with:
          path: ~/toolchains/clang-android
          key: clang-r416183b
          restore-keys: |
            clang-r416183b

      - name: 下载 Clang (clang-r416183b)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/428d18d9732aa7ebfcaed87a582d86155db878d4/clang-r416183b.tar.gz -o clang-r416183b.tar.gz
          mkdir -p clang-android
          tar -xf clang-r416183b.tar.gz -C clang-android

      # -------------------- Clang 缓存上传 --------------------
      - name: 上传 Clang 缓存
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v3
        with:
          path: ~/toolchains/clang-android
          key: clang-r416183b

      # -------------------- 设置环境变量 --------------------
      - name: 设置环境变量
        run: |
          echo "PATH=$HOME/toolchains/clang-android/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      # -------------------- 配置内核 --------------------
      - name: 配置内核
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_HOST="Marble"
          export KBUILD_BUILD_USER="Guxin12"
          # 禁用 32 位 VDSO 避免 -EL 错误
          scripts/config --disable CONFIG_ARM64_VDSO32
          make mrproper
          make O=out b1c1_defconfig

      # -------------------- 编译内核 --------------------
      - name: 编译内核
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_HOST="Marble"
          export KBUILD_BUILD_USER="Guxin12"
          make -j$(nproc) O=out \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # -------------------- 打包内核 --------------------
      - name: 打包内核
        run: |
          cd out/arch/arm64/boot
          zip -r9 kernel-${{ github.event.inputs.tag_name }}.zip Image.gz-dtb

      # -------------------- 上传 Release --------------------
      - name: 上传 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: out/arch/arm64/boot/kernel-${{ github.event.inputs.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}